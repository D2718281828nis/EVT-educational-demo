[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="evt-educational-demo"
version="0.3.0"
description="Educational Graph-EVT research workflow for a one-dimensional extreme series"
requires-python=">=3.10"
dependencies=["numpy>=1.24","pandas>=2.0","scipy>=1.10","scikit-learn>=1.3","matplotlib>=3.7","graph-evt-agent @ git+https://github.com/D2718281828nis/Graph-EVT-agent.git@a77f488c61682124a46fb525e6622e06333f2668"]
[project.optional-dependencies]
dev=["pytest>=7.0","jupyter>=1.0"]
[tool.pytest.ini_options]
testpaths=["tests"]
addopts="-q"
pythonpath=["src"]
